name: C/C++ CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libyaml-dev bats pandoc valgrind libcunit1-dev

      - name: Build executable
        run: make

      - name: Run unit and functional tests
        run: make test

      - name: Run code coverage analysis
        run: make couverture

      - name: Check memory leaks with Valgrind
        run: make valgrind

      - name: Generate documentation
        run: make html
